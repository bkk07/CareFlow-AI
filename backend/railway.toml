# Railway service config — lives in backend/ so the service root IS backend/.
# Create a service from the backend folder; Railway builds Dockerfile here.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway hits this path to decide the container is live.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
